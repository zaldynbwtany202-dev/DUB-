[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dub-forge"
version = "1.0.0"
description = "Professional AI video dubbing pipeline: transcribe → separate → translate → voice-clone TTS → lip-window sync → mix"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zaldynbwtany202-dev" }]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Local transcription (word-level timestamps)
whisper = ["faster-whisper>=1.0"]
# Local stem separation (vocals / background)
demucs = ["demucs>=4.0"]
# Local voice cloning TTS (17 languages incl. Arabic)
# transformers pinned: BeamSearchScorer (needed by TTS 0.22) was removed in 4.46+
# numpy pinned: TTS/trainer 0.22 break on numpy 2
# torch pinned: torch>=2.6 loads checkpoints with weights_only=True which
# rejects the XTTS config class — stay on 2.5.x
xtts = ["TTS>=0.22", "transformers==4.45.2", "numpy<2", "torch<2.6", "torchaudio<2.6"]
# Offline translation
argos = ["argostranslate>=1.9"]
# Free online translation (maintained Google Translate client)
google = ["deep-translator>=1.11"]
# Additional free / open-source TTS engines
piper = ["piper-tts>=1.2"]                          # Apache 2.0, presets, real-time
chatterbox = ["chatterbox-tts>=0.1", "torchaudio"]  # MIT, voice cloning
f5 = ["f5-tts>=0.3", "soundfile"]                   # CC-BY-NC, SOTA cloning
dev = ["pytest>=8.0"]

[project.scripts]
dub = "dub.cli:main"

[tool.setuptools.packages.find]
include = ["dub*"]
