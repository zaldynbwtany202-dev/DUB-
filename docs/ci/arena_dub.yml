name: Arena dub — transcribe & publish

on:
  push:
    branches: [arena/01a08cfe-dub]
    paths: [".arena/run.json"]
  workflow_dispatch:
    inputs:
      video_url:
        description: "MP4 URL (fallback when .arena/run.json absent)"
        required: false
        default: ""
      reference_audio:
        description: "Reference mp3 path in repo (kept for future clone runs)"
        required: false
        default: "docs/samples-registry/voice-11.mp3"
      src_lang:
        description: "Source language (ISO-639-1)"
        required: false
        default: "ar"
      whisper_model:
        description: "faster-whisper model size"
        required: false
        default: "base"

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve run config (dispatch inputs or .arena/run.json)
        run: |
          set -e
          VU="${{ inputs.video_url }}"
          RA="${{ inputs.reference_audio }}"
          SL="${{ inputs.src_lang }}"
          WM="${{ inputs.whisper_model }}"
          if [ -f .arena/run.json ]; then
            VU=$(python3 -c "import json,sys;print(json.load(open('.arena/run.json')).get('video_url',''))" || true)
            RA=$(python3 -c "import json,sys;print(json.load(open('.arena/run.json')).get('reference_audio',''))" || true)
            SL=$(python3 -c "import json,sys;print(json.load(open('.arena/run.json')).get('src_lang',''))" || true)
            WM=$(python3 -c "import json,sys;print(json.load(open('.arena/run.json')).get('whisper_model',''))" || true)
          fi
          [ -n "$VU" ] || { echo "video_url is empty"; exit 1; }
          [ -n "$RA" ] || RA="docs/samples-registry/voice-11.mp3"
          [ -n "$SL" ] || SL="ar"
          [ -n "$WM" ] || WM="base"
          echo "video_url=$VU" >> "$GITHUB_ENV"
          echo "reference_audio=$RA" >> "$GITHUB_ENV"
          echo "src_lang=$SL" >> "$GITHUB_ENV"
          echo "whisper_model=$WM" >> "$GITHUB_ENV"
          echo "config: $VU | ref=$RA | lang=$SL | model=$WM"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps (faster-whisper only — TTS is done by the brain)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet faster-whisper numpy soundfile

      - name: Download source video
        run: |
          set -e
          curl -fL --retry 3 -o work_video.mp4 "$video_url"
          ls -la work_video.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 work_video.mp4 > video_duration.txt
          echo "video duration: $(cat video_duration.txt)s"

      - name: Transcribe (faster-whisper, real model, full internet)
        run: |
          set -e
          ffmpeg -y -v error -i work_video.mp4 -ar 16000 -ac 1 work_audio.wav
          python - <<'PY'
          import json, os
          from faster_whisper import WhisperModel
          model = WhisperModel(os.environ.get("whisper_model", "base"), device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              "work_audio.wav",
              language=os.environ.get("src_lang", "ar") or None,
              vad_filter=True,
              beam_size=5,
          )
          segs = []
          full = []
          for s in segments:
              segs.append({"start": round(s.start, 2), "end": round(s.end, 2), "text": s.text.strip()})
              full.append(s.text.strip())
          text = " ".join(full)
          json.dump(
              {"lang": info.language, "duration": info.duration, "text": text, "segments": segs},
              open("transcript.json", "w"),
              ensure_ascii=False,
              indent=2,
          )
          print("LANG:", info.language, "| DUR:", round(info.duration, 1))
          print("TRANSCRIPT_TEXT_START")
          print(text)
          print("TRANSCRIPT_TEXT_END")
          PY

      - name: Publish transcript to branch (brain reads it via git)
        run: |
          set -e
          git config user.name "arena-body"
          git config user.email "arena-body@users.noreply.github.com"
          cp transcript.json .arena/transcript.json
          git add .arena/transcript.json
          git commit -m "arena(transcribe): transcript for $(basename "$video_url")"
          git pull --rebase origin arena/01a08cfe-dub
          git push origin HEAD:arena/01a08cfe-dub
          echo "transcript committed to branch — brain can git pull now"

      - name: Upload transcript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: transcript.json
          retention-days: 14
